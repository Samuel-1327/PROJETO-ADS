spring.application.name=mindtrack-api

# Banco H2 em memoria (zera quando a aplicacao reinicia). Console: /h2-console
spring.datasource.url=jdbc:h2:mem:mindtrack
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# IA (Groq). A chave vem da variavel de ambiente GROQ_API_KEY - NUNCA escreva a chave aqui.
groq.api-key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
groq.url=https://api.groq.com/openai/v1/chat/completions
